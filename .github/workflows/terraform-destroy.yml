name: Terraform Destroy

# Apaga TODA la infraestructura (terraform destroy). Solo por boton manual
# (Actions -> Terraform Destroy -> Run workflow) y con las credenciales del
# Learner Lab cargadas como secrets. Candado: hay que escribir "destroy" para
# confirmar, asi no se dispara de casualidad.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribi "destroy" para confirmar que queres DESTRUIR toda la infraestructura.'
        type: string
        required: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_WORKING_DIR: terraform/organization
  TF_VERSION: "1.11.4"
  AWS_REGION: us-east-1

jobs:
  destroy:
    name: terraform destroy
    # Solo corre si se escribio exactamente "destroy". Si no, el job se saltea.
    if: ${{ inputs.confirm == 'destroy' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verificar credenciales del lab
        run: aws sts get-caller-identity

      # El state vive en el bucket que creo el workflow de deploy; se resuelve
      # igual, por account id, para apuntar el backend al mismo lugar.
      - name: Resolver bucket de state
        id: backend
        working-directory: ${{ github.workspace }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "bucket=bookup-tfstate-${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: terraform init (backend S3)
        run: terraform init -input=false -backend-config="bucket=${{ steps.backend.outputs.bucket }}"

      # Los buckets y el repo de ECR tienen force_destroy, asi que se borran con
      # contenido. El bucket del state (bookup-tfstate-*) NO lo maneja Terraform,
      # asi que queda; se puede borrar a mano despues si se quiere.
      - name: terraform destroy
        run: terraform destroy -input=false -no-color -auto-approve
