services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bookup
      POSTGRES_PASSWORD: bookup
      POSTGRES_DB: bookup
    ports:
      - "5432:5432"
    volumes:
      - bookup_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookup"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Stand-in local de ElastiCache for Redis: sin persistencia (`--appendonly no --save ""`),
  # que es como se configura un cache puro.
  #
  # `volatile-lru` no es un detalle: es el default de ElastiCache y, sobre todo, es lo que
  # hace segura la invalidación por generaciones. Solo desaloja claves con TTL, y los
  # contadores `bookup:ver:*` se escriben con INCR, sin TTL. Con `allkeys-lru` un contador
  # podría ser desalojado, volver a leerse como 0 y resucitar entradas viejas de la
  # generación 0 que todavía no vencieron. Ver `api/app/cache.py`.
  cache:
    image: redis:7-alpine
    command: >
      redis-server --appendonly no --save "" --maxmemory 256mb
      --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Stand-in local de S3 para las portadas de libros, igual que `cache` lo es de
  # ElastiCache. MinIO habla el mismo protocolo, así que en AWS solo cambian las
  # variables de entorno: se borran los endpoints y el bucket pasa a ser el real.
  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bookup
      MINIO_ROOT_PASSWORD: bookup123
      # El browser sube la portada con un PUT firmado desde otro origen.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - bookup_storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: crea el bucket y lo deja de lectura pública (las portadas se sirven
  # directo, como saldrían por CloudFront). La escritura sigue pidiendo firma.
  storage-init:
    image: minio/mc
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://storage:9000 bookup bookup123 &&
      mc mb --ignore-existing local/bookup-covers &&
      mc anonymous set download local/bookup-covers
      "

  # Stand-in local de DynamoDB (migración desde Postgres, ver `api/ROADMAP.md`). Mientras
  # dura la migración convive con `db`; la API todavía no lo usa hasta la fase 4.
  #
  # `-sharedDb` hace que todas las credenciales/regiones vean la misma tabla (sin eso,
  # DynamoDB Local crea un archivo por access key + región y "no encuentra" lo que
  # otro cliente creó). Corre como root porque un volumen nombrado nace con dueño root y
  # el usuario de la imagen no podría escribir el archivo de la base.
  dynamodb:
    image: amazon/dynamodb-local
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /data
    ports:
      - "8001:8000"   # 8000 ya es la API
    volumes:
      - bookup_dynamo_data:/data
    healthcheck:
      # Sin `-f`: en la raíz responde 400, y lo que importa es que acepte conexiones.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: crea la tabla `bookup` y sus 4 GSIs (reemplaza a `alembic upgrade head`).
  # Mismo patrón que `storage-init`. Es idempotente, así que re-correrlo no cuesta nada.
  # El índice de OpenSearch lo crea la fase 6, no esto.
  dynamodb-init:
    build: ./api
    environment:
      DYNAMO_TABLE: bookup
      DYNAMO_ENDPOINT_URL: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: bookup
      AWS_SECRET_ACCESS_KEY: bookup123
    depends_on:
      dynamodb:
        condition: service_healthy
    volumes:
      - ./api:/app
    command: python -m app.persistence.table
    restart: "no"

  # Proyección de solo lectura del catálogo para filtros combinables y texto libre. Es
  # descartable: la fuente de verdad es DynamoDB y `app.reindex` (fase 6) lo reconstruye.
  # Single-node y sin el plugin de seguridad, porque es un entorno local; heap acotado
  # para que no se coma la RAM de la máquina de desarrollo.
  search:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - bookup_search_data:/usr/share/opensearch/data
    healthcheck:
      # `yellow` es lo mejor que alcanza un single-node: las réplicas quedan sin asignar.
      test: ["CMD-SHELL", "curl -s 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' | grep -qE '\"status\":\"(yellow|green)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg2://bookup:bookup@db:5432/bookup
      REDIS_URL: redis://cache:6379/0
      # Desde la fase 4 los services leen y escriben en DynamoDB (la base de verdad).
      # Postgres sigue levantado solo hasta la fase 7, que lo borra junto con alembic.
      DYNAMO_TABLE: bookup
      DYNAMO_ENDPOINT_URL: http://dynamodb:8000
      AWS_REGION: us-east-1
      # Sin consumidores hasta la fase 6.
      OPENSEARCH_URL: http://search:9200
      OPENSEARCH_INDEX: bookup-books
      JWT_SECRET: dev-secret-change-me
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      S3_BUCKET: bookup-covers
      S3_REGION: us-east-1
      # Endpoint interno (red de compose) para head/delete...
      S3_ENDPOINT_URL: http://storage:9000
      # ...y el que ve el browser: SigV4 firma el Host, así que la URL firmada tiene
      # que apuntar a donde el browser realmente puede hacer el PUT.
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: bookup
      AWS_SECRET_ACCESS_KEY: bookup123
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      storage:
        condition: service_healthy
      # La tabla tiene que existir antes de que la API reciba tráfico.
      dynamodb-init:
        condition: service_completed_successfully
    volumes:
      - ./api:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  bookup_db_data:
  bookup_storage_data:
  bookup_dynamo_data:
  bookup_search_data:
