openapi: 3.0.3
info:
  title: BookUp API
  description: >
    API del MVP de BookUp: catálogo de libros, sedes de biblioteca, reservas de
    ejemplares físicos y usuarios. Generado a partir del código en
    `api/app/controllers/` (routers FastAPI) y `api/app/controllers/schemas.py`.
  version: "0.1.0"
servers:
  - url: http://localhost:8000
    description: Desarrollo local

tags:
  - name: auth
    description: Login y datos del usuario autenticado
  - name: catalog
    description: >
      Catálogo de libros. Lectura pública; la escritura requiere
      `librarian`/`sysadmin`.
  - name: authors
    description: Autores del catálogo
  - name: genres
    description: Géneros del catálogo
  - name: physical_books
    description: Ejemplares físicos de un libro en una sede
  - name: libraries
    description: Sedes de biblioteca
  - name: reservations
    description: Reservas de ejemplares físicos
  - name: users
    description: Usuarios (clientes, bibliotecarios, sysadmins)
  - name: health
    description: Chequeo de salud del servicio

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Obtener un token de acceso
      description: >
        Valida email + password y devuelve un JWT firmado (HS256) con el id, el
        rol y la sede del usuario. Responde 401 tanto si el email no existe como
        si la password es incorrecta, para no filtrar qué emails están
        registrados.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/me:
    get:
      tags: [auth]
      summary: Datos del usuario autenticado
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: El servicio está operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /books:
    get:
      tags: [catalog]
      summary: Listar todos los libros del catálogo
      operationId: listBooks
      responses:
        "200":
          description: Lista de libros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookOut"
    post:
      tags: [catalog]
      summary: Crear un libro en el catálogo
      description: >
        Requiere `librarian` o `sysadmin`. El `isbn` tiene que ser un ISBN-13
        válido (13 dígitos y dígito verificador correcto), si no da 422.
        `author_ids`/`genre_ids` referencian autores y géneros ya existentes:
        si alguno no existe, 404.
      operationId: createBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreate"
      responses:
        "201":
          description: Libro creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /books/search:
    get:
      tags: [catalog]
      summary: Buscar libros por texto libre
      description: >
        Búsqueda por título/ISBN/autor usando `ILIKE` (placeholder; en la
        arquitectura target se reemplaza por OpenSearch).
      operationId: searchBooks
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Libros que matchean la búsqueda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookOut"
        "422":
          $ref: "#/components/responses/ValidationError"

  /books/{isbn}:
    get:
      tags: [catalog]
      summary: Obtener un libro por ISBN
      operationId: getBook
      parameters:
        - $ref: "#/components/parameters/IsbnPath"
      responses:
        "200":
          description: Libro encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookOut"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [catalog]
      summary: Actualizar un libro
      description: >
        Requiere `librarian` o `sysadmin`. Actualización parcial; solo se
        aplican los campos enviados. Enviar `author_ids`/`genre_ids`
        **reemplaza** la lista completa (mandar `[]` la vacía); omitirlos la
        deja como estaba.
      operationId: updateBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IsbnPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: Libro actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [catalog]
      summary: Eliminar un libro del catálogo
      description: >
        Requiere `librarian` o `sysadmin`. Falla con 409 si el libro todavía
        tiene ejemplares físicos en alguna sede.
      operationId: deleteBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IsbnPath"
      responses:
        "204":
          description: Libro eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /books/{isbn}/availability:
    get:
      tags: [catalog]
      summary: Disponibilidad de un libro por sede
      description: >
        Agrupa los ejemplares físicos (`PhysicalBook`) disponibles del libro
        por sede, e informa un `physical_book_id` representativo listo para
        reservar en cada sede.
      operationId: getBookAvailability
      parameters:
        - $ref: "#/components/parameters/IsbnPath"
      responses:
        "200":
          description: Disponibilidad por sede
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookAvailability"
        "404":
          $ref: "#/components/responses/NotFound"

  /authors:
    get:
      tags: [authors]
      summary: Listar autores
      operationId: listAuthors
      responses:
        "200":
          description: Lista de autores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthorOut"
    post:
      tags: [authors]
      summary: Crear un autor
      description: >
        Requiere `librarian` o `sysadmin`. `Author.name` no es único en el
        modelo: se permiten homónimos (dos autores distintos pueden llamarse
        igual) y la identidad es el `id`, así que crear el mismo nombre dos
        veces devuelve dos autores distintos, no un 409.
      operationId: createAuthor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorCreate"
      responses:
        "201":
          description: Autor creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /authors/{author_id}:
    get:
      tags: [authors]
      summary: Obtener un autor por id
      operationId: getAuthor
      parameters:
        - $ref: "#/components/parameters/AuthorIdPath"
      responses:
        "200":
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorOut"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [authors]
      summary: Actualizar un autor
      description: Requiere `librarian` o `sysadmin`.
      operationId: updateAuthor
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorUpdate"
      responses:
        "200":
          description: Autor actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [authors]
      summary: Eliminar un autor
      description: >
        Requiere `librarian` o `sysadmin`. Falla con 409 si el autor todavía
        está asociado a algún libro.
      operationId: deleteAuthor
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorIdPath"
      responses:
        "204":
          description: Autor eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /genres:
    get:
      tags: [genres]
      summary: Listar géneros
      operationId: listGenres
      responses:
        "200":
          description: Lista de géneros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenreOut"
    post:
      tags: [genres]
      summary: Crear un género
      description: >
        Requiere `librarian` o `sysadmin`. A diferencia de los autores,
        `Genre.name` **sí** es único: un nombre repetido da 409.
      operationId: createGenre
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenreCreate"
      responses:
        "201":
          description: Género creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /genres/{genre_id}:
    get:
      tags: [genres]
      summary: Obtener un género por id
      operationId: getGenre
      parameters:
        - $ref: "#/components/parameters/GenreIdPath"
      responses:
        "200":
          description: Género encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreOut"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [genres]
      summary: Actualizar un género
      description: Requiere `librarian` o `sysadmin`. 409 si el nombre ya lo usa otro género.
      operationId: updateGenre
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GenreIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenreUpdate"
      responses:
        "200":
          description: Género actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [genres]
      summary: Eliminar un género
      description: >
        Requiere `librarian` o `sysadmin`. Falla con 409 si el género todavía
        está asociado a algún libro.
      operationId: deleteGenre
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GenreIdPath"
      responses:
        "204":
          description: Género eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /physical-books:
    get:
      tags: [physical_books]
      summary: Listar ejemplares físicos
      operationId: listPhysicalBooks
      parameters:
        - name: isbn
          in: query
          required: false
          schema:
            type: string
        - name: library_id
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PhysicalBookStatus"
      responses:
        "200":
          description: Lista de ejemplares
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhysicalBookOut"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [physical_books]
      summary: Dar de alta un ejemplar en una sede
      description: >
        Requiere `sysadmin`, o el `librarian` de **esa** sede. El ejemplar nace
        en estado `available`. 404 si el libro o la sede no existen.
      operationId: createPhysicalBook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhysicalBookCreate"
      responses:
        "201":
          description: Ejemplar creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicalBookOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /physical-books/{physical_book_id}:
    get:
      tags: [physical_books]
      summary: Obtener un ejemplar por id
      operationId: getPhysicalBook
      parameters:
        - $ref: "#/components/parameters/PhysicalBookIdPath"
      responses:
        "200":
          description: Ejemplar encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicalBookOut"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [physical_books]
      summary: Dar de baja un ejemplar
      description: >
        Requiere `sysadmin`, o el `librarian` de la sede que lo tiene. Falla con
        409 si el ejemplar todavía tiene reservas asociadas.
      operationId: deletePhysicalBook
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PhysicalBookIdPath"
      responses:
        "204":
          description: Ejemplar eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /physical-books/{physical_book_id}/status:
    patch:
      tags: [physical_books]
      summary: Cambiar el estado de un ejemplar
      description: >
        Requiere `sysadmin`, o el `librarian` de la sede que lo tiene. Solo
        admite las transiciones manuales `available` ↔ `lost`: pedir `reserved`
        o `loaned` da 409 porque esos estados los maneja el flujo de reservas
        (`POST /reservations`, `PATCH /reservations/{id}/pickup`), y un ejemplar
        que hoy está `reserved`/`loaned` tampoco se puede tocar por acá — hay
        que resolver su reserva primero.
      operationId: updatePhysicalBookStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PhysicalBookIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhysicalBookStatusUpdate"
      responses:
        "200":
          description: Ejemplar actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhysicalBookOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /libraries:
    get:
      tags: [libraries]
      summary: Listar sedes de biblioteca
      operationId: listLibraries
      responses:
        "200":
          description: Lista de sedes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryOut"
    post:
      tags: [libraries]
      summary: Crear una sede de biblioteca
      description: Solo `sysadmin`.
      operationId: createLibrary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryCreate"
      responses:
        "201":
          description: Sede creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /libraries/{library_id}:
    get:
      tags: [libraries]
      summary: Obtener una sede por id
      operationId: getLibrary
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
      responses:
        "200":
          description: Sede encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryOut"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [libraries]
      summary: Actualizar una sede
      description: >
        Actualización parcial; solo se aplican los campos enviados. Un campo
        enviado en `null` se ignora (no borra el valor existente).
        Requiere `sysadmin`, o el `librarian` a cargo de **esta** sede.
      operationId: updateLibrary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryUpdate"
      responses:
        "200":
          description: Sede actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [libraries]
      summary: Eliminar una sede
      description: >
        Solo `sysadmin`. Falla con 409 si la sede todavía tiene ejemplares
        físicos asociados, para no dejarlos huérfanos.
      operationId: deleteLibrary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LibraryIdPath"
      responses:
        "204":
          description: Sede eliminada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /reservations:
    post:
      tags: [reservations]
      summary: Crear una reserva
      description: >
        Reserva un ejemplar físico puntual (`physical_book_id`) **a nombre del
        usuario autenticado**: el dueño de la reserva sale del token, ya no del
        body. Falla con 404 si el ejemplar no existe, y con 409 si el ejemplar
        no está `available` (ya reservado, prestado o perdido). Al crearse, el
        ejemplar pasa a estado `reserved`.
      operationId: createReservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCreate"
      responses:
        "201":
          description: Reserva creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [reservations]
      summary: Listar reservas
      description: >
        El alcance depende del rol: un `sysadmin` ve todas, un `librarian` solo
        las de su sede (pedir otra da 403), y un `customer` solo las propias.
      operationId: listReservations
      security:
        - bearerAuth: []
      parameters:
        - name: library_id
          in: query
          required: false
          schema:
            type: integer
          description: Filtra las reservas por sede (a través del ejemplar físico).
      responses:
        "200":
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reservations/{reservation_id}:
    get:
      tags: [reservations]
      summary: Obtener una reserva por id
      description: >
        Accesible para el dueño de la reserva, el `librarian` de la sede que
        tiene el ejemplar, o un `sysadmin`.
      operationId: getReservation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReservationIdPath"
      responses:
        "200":
          description: Reserva encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /reservations/{reservation_id}/pickup:
    patch:
      tags: [reservations]
      summary: Marcar una reserva como retirada
      description: >
        Marca `picked_up = true` en la reserva y pasa el ejemplar físico
        asociado a estado `loaned`. Requiere ser el `librarian` de la sede que
        tiene el ejemplar, o un `sysadmin`.
      operationId: markReservationPickedUp
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReservationIdPath"
      responses:
        "200":
          description: Reserva actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users:
    post:
      tags: [users]
      summary: Crear un usuario
      description: >
        Auto-registro público: crea un usuario con rol `customer` fijo. Para
        dar de alta `librarian`/`sysadmin` está `POST /users/staff`. Falla con
        409 si el email ya está registrado.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [users]
      summary: Listar usuarios
      description: Solo `sysadmin`.
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/staff:
    post:
      tags: [users]
      summary: Crear un usuario de personal (librarian/sysadmin)
      description: >
        Solo `sysadmin`. A diferencia de `POST /users`, permite elegir `role` y
        asignar `library_id`. `library_id` solo es válido junto con
        `role=librarian` (409 en cualquier otra combinación) y la sede tiene que
        existir (404).
      operationId: createStaffUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStaffCreate"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/{user_id}:
    get:
      tags: [users]
      summary: Obtener un usuario por id
      description: Accesible para el propio usuario o para un `sysadmin`.
      operationId: getUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [users]
      summary: Actualizar un usuario
      description: >
        Actualización parcial; solo se aplican los campos enviados. Accesible
        para el propio usuario o para un `sysadmin`, pero `role` y `library_id`
        solo los puede tocar un `sysadmin` (403 en caso contrario). Bajar a un
        `librarian` a otro rol limpia su `library_id` automáticamente.
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [users]
      summary: Eliminar un usuario
      description: Accesible para el propio usuario o para un `sysadmin`.
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIdPath"
      responses:
        "204":
          description: Usuario eliminado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT emitido por `POST /auth/login`, enviado en el header
        `Authorization` con el prefijo `Bearer`.

  parameters:
    IsbnPath:
      name: isbn
      in: path
      required: true
      schema:
        type: string
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
    LibraryIdPath:
      name: library_id
      in: path
      required: true
      schema:
        type: integer
    ReservationIdPath:
      name: reservation_id
      in: path
      required: true
      schema:
        type: integer
    AuthorIdPath:
      name: author_id
      in: path
      required: true
      schema:
        type: integer
    GenreIdPath:
      name: genre_id
      in: path
      required: true
      schema:
        type: integer
    PhysicalBookIdPath:
      name: physical_book_id
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    Unauthorized:
      description: Falta el token, está vencido o es inválido
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    Forbidden:
      description: El usuario está autenticado pero no tiene permiso para esta operación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    Conflict:
      description: La operación entra en conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    ValidationError:
      description: Error de validación del payload/parámetros (FastAPI/Pydantic)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPValidationError"

  schemas:
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
      example:
        detail: "Book 9780000000000 not found"

    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string

    LibraryBase:
      type: object
      required: [name, address, state, city]
      properties:
        name:
          type: string
        address:
          type: string
        state:
          type: string
        city:
          type: string
        hours:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        website:
          type: string
          nullable: true

    LibraryCreate:
      allOf:
        - $ref: "#/components/schemas/LibraryBase"

    LibraryUpdate:
      type: object
      description: Todos los campos son opcionales; solo se aplican los enviados.
      properties:
        name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        hours:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        website:
          type: string
          nullable: true

    LibraryOut:
      allOf:
        - $ref: "#/components/schemas/LibraryBase"
        - type: object
          required: [id]
          properties:
            id:
              type: integer

    AuthorOut:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    AuthorCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    AuthorUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          nullable: true

    GenreOut:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    GenreCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    GenreUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          nullable: true

    BookBase:
      type: object
      required: [isbn, title, language]
      properties:
        isbn:
          type: string
        title:
          type: string
        language:
          type: string
        pages:
          type: integer
          nullable: true
        synopsis:
          type: string
          nullable: true

    BookOut:
      allOf:
        - $ref: "#/components/schemas/BookBase"
        - type: object
          properties:
            authors:
              type: array
              items:
                $ref: "#/components/schemas/AuthorOut"
              default: []
            genres:
              type: array
              items:
                $ref: "#/components/schemas/GenreOut"
              default: []

    BookCreate:
      allOf:
        - $ref: "#/components/schemas/BookBase"
        - type: object
          properties:
            isbn:
              type: string
              description: ISBN-13 válido (13 dígitos y dígito verificador correcto).
              pattern: "^[0-9]{13}$"
            author_ids:
              type: array
              items:
                type: integer
              default: []
            genre_ids:
              type: array
              items:
                type: integer
              default: []

    BookUpdate:
      type: object
      description: >
        Actualización parcial. `author_ids`/`genre_ids` reemplazan la lista
        completa cuando se envían.
      properties:
        title:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        pages:
          type: integer
          nullable: true
        synopsis:
          type: string
          nullable: true
        author_ids:
          type: array
          items:
            type: integer
          nullable: true
        genre_ids:
          type: array
          items:
            type: integer
          nullable: true

    PhysicalBookStatus:
      type: string
      enum: [available, reserved, loaned, lost]

    PhysicalBookOut:
      type: object
      required: [id, isbn, library_id, status]
      properties:
        id:
          type: integer
        isbn:
          type: string
        library_id:
          type: integer
        status:
          $ref: "#/components/schemas/PhysicalBookStatus"

    PhysicalBookCreate:
      type: object
      required: [isbn, library_id]
      properties:
        isbn:
          type: string
          description: ISBN-13 válido de un libro ya existente en el catálogo.
          pattern: "^[0-9]{13}$"
        library_id:
          type: integer

    PhysicalBookStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/PhysicalBookStatus"

    LibraryAvailability:
      type: object
      required: [library, available_copies, physical_book_id]
      properties:
        library:
          $ref: "#/components/schemas/LibraryOut"
        available_copies:
          type: integer
        physical_book_id:
          type: integer
          description: Id representativo de un ejemplar físico disponible en esta sede, listo para reservar.

    BookAvailability:
      type: object
      required: [book, libraries]
      properties:
        book:
          $ref: "#/components/schemas/BookOut"
        libraries:
          type: array
          items:
            $ref: "#/components/schemas/LibraryAvailability"

    UserRole:
      type: string
      enum: [customer, librarian, sysadmin]

    UserOut:
      type: object
      required: [id, email, name, language, role]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        language:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        library_id:
          type: integer
          nullable: true
          description: Sede a cargo (solo aplica a `librarian`).

    UserCreate:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        language:
          type: string
          default: es

    UserStaffCreate:
      type: object
      required: [email, password, name, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        language:
          type: string
          default: es
        role:
          $ref: "#/components/schemas/UserRole"
        library_id:
          type: integer
          nullable: true
          description: Sede a cargo; solo válido con `role=librarian`.

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        password:
          type: string
          minLength: 8
          nullable: true
        role:
          allOf:
            - $ref: "#/components/schemas/UserRole"
          nullable: true
          description: Solo lo puede enviar un `sysadmin`.
        library_id:
          type: integer
          nullable: true
          description: Solo lo puede enviar un `sysadmin`, y solo con `role=librarian`.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenOut:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: bearer
        expires_in:
          type: integer
          description: Vigencia del token en segundos.

    ReservationCreate:
      type: object
      required: [physical_book_id, expires_at]
      description: >
        El dueño de la reserva sale del token; `user_id` ya no se envía en el body.
      properties:
        physical_book_id:
          type: integer
        expires_at:
          type: string
          format: date-time

    ReservationOut:
      type: object
      required: [id, user_id, physical_book_id, reserved_at, expires_at, picked_up]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        physical_book_id:
          type: integer
        reserved_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        picked_up:
          type: boolean
